  LP Black Scooto — BLOCO C (pós-form): fim da seção 10 (CTA WhatsApp + selos) e
  seção 11 (FOOTER). Widget HTML do Elementor, colado LOGO ABAIXO do widget Form
  "Formulário LP Black" (contrato § 1). Zero JS.

  Decisões do dono já aplicadas (contrato §§ 6 e 7): a linha do cadastro fiscal
  placeholder saiu (o dono mandou remover; nenhum número foi chutado no lugar);
  "Termos de Uso" saiu (a página não existe em scooto.co); ficam os 3 perfis reais
  (Instagram, LinkedIn, Facebook). O logo 32px da coluna 1 não foi entregue pelo Figma
  (IMG-751 veio vazio no dump, e não há binário em assets/) — a coluna abre direto na
  razão social; quando o dono passar o arquivo, ele entra antes do <p> da marca.

  A marca decorativa da seção 10 (formulario-marca-branca.png, 600×600, opacity .07)
  vive na faixa vertical do CARD do formulário, que é widget de outra track; aqui ela
  entra como background do bloco rosa, sangrando para fora à direita e CONTIDA por
  overflow: hidden — sem isso vira rolagem horizontal no mobile.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,600;0,700;1,400&family=Sora:wght@400;600;700&display=swap');

/* box-sizing escopado: o tema do WordPress não é confiável nesse ponto. */
.lpb-fecho, .lpb-fecho *, .lpb-rodape, .lpb-rodape * { box-sizing: border-box; }

/* ---------- seção 10 — fecho rosa (abaixo do card do formulário) ---------- */
.lpb-fecho {
  position: relative;
  overflow: hidden;
  background: #f12d64;
  padding: 28px 0 96px;
  font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
}
.lpb-fecho::before {
  content: "";
  position: absolute;
  top: 50%;
  right: -200px;
  width: 600px;
  height: 600px;
  transform: translateY(-50%);
  background: url('https://raw.githubusercontent.com/rafa-bulgarelli/lp-black-scooto-assets/main/formulario-marca-branca.png') no-repeat center / contain;
  opacity: .07;
  pointer-events: none;
}
.lpb-fecho__interno { position: relative; max-width: 768px; margin: 0 auto; padding: 0 24px; }
.lpb-fecho__chamada {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 20px;
  color: rgba(255, 255, 255, .8);
  text-align: center;
}
.lpb-fecho__zap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 44px;
  padding: 0 24px;
  border-radius: 9999px;
  background: #ffffff;
  color: #f12d64;
  font-weight: 600;
  font-size: 14px;
  line-height: 20px;
  text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease;
}
.lpb-fecho__zap:hover {
  color: #f12d64;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
}
.lpb-fecho__zap-linha { text-align: center; }
.lpb-fecho__zap-icone { display: block; }
.lpb-fecho__selos {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 16px;
  /* margin explicito: o <p> do tema traz margin-bottom e alonga a faixa rosa. */
  margin: 49px 0 0;
  padding-top: 33px;
  border-top: 1px solid rgba(255, 255, 255, .2);
  font-size: 12px;
  line-height: 16px;
  color: rgba(255, 255, 255, .7);
}
.lpb-fecho__ponto { color: rgba(255, 255, 255, .45); }

/* ---------- seção 11 — footer ---------- */
.lpb-rodape {
  background: #ffffff;
  border-top: 1px solid #dfdfd4;
  padding: 49px 0 48px;
  font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
}
.lpb-rodape__interno { max-width: 1152px; margin: 0 auto; padding: 0 24px; }
.lpb-rodape__colunas { display: flex; gap: 32px; }
.lpb-rodape__coluna { flex: 1 1 0; min-width: 0; }
.lpb-rodape__titulo {
  margin: 0 0 8px;
  font-weight: 600;
  font-size: 14px;
  line-height: 20px;
  color: #111116;
}
.lpb-rodape__texto { margin: 0; font-size: 14px; line-height: 20px; color: #717386; }
.lpb-rodape__link {
  display: inline-block;
  font-size: 14px;
  line-height: 20px;
  color: #717386;
  text-decoration: none;
  transition: color .2s ease;
}
.lpb-rodape__link:hover { color: #4a1be8; text-decoration: underline; }
.lpb-rodape__base {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-top: 37px;
  padding-top: 25px;
  border-top: 1px solid #dfdfd4;
}
.lpb-rodape__copy { margin: 0; font-size: 12px; line-height: 16px; color: #717386; }
.lpb-rodape__sociais { display: flex; align-items: center; gap: 16px; }
.lpb-rodape__social {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 9999px;
  background: #4a1be8;
  color: #ffffff;
  transition: background-color .2s ease;
}
.lpb-rodape__social:hover { background: #3f14c9; }
.lpb-rodape__icone { display: block; }

/* ---------- mobile: sem frame no Figma, o critério é dignidade ---------- */
@media (max-width: 900px) {
  .lpb-fecho { padding: 24px 0 64px; }
  .lpb-fecho::before { right: -110px; width: 320px; height: 320px; }
  .lpb-fecho__interno { padding: 0 16px; }
  .lpb-fecho__selos { margin-top: 32px; padding-top: 24px; }
  .lpb-rodape { padding: 40px 0 40px; }
  .lpb-rodape__interno { padding: 0 16px; }
  .lpb-rodape__colunas { flex-direction: column; gap: 28px; }
  .lpb-rodape__base { flex-direction: column; align-items: flex-start; gap: 20px; margin-top: 28px; }
}
@media (max-width: 480px) {
  .lpb-fecho__zap { width: 100%; }
  /* Empilhado: em 2 linhas o separador "." sobra no fim da primeira e suja o ritmo. */
  .lpb-fecho__selos { flex-direction: column; gap: 6px; }
  .lpb-fecho__ponto { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lpb-fecho__zap, .lpb-rodape__link, .lpb-rodape__social { transition: none; }
}
</style>
