<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── O QUE O SITE DIZ QUANDO NÃO É O SITE QUE APARECE ─────────────────
         O funil desta página termina no WhatsApp, e é lá que o link dela vai
         ser colado. Sem estas linhas, o que chega no aplicativo é uma URL crua:
         sem título, sem frase, sem nada que explique o que é. A primeira
         impressão da Doxa, na maioria dos casos, vai ser esta caixinha — e não
         a primeira dobra que o resto do repositório passou semanas afinando.

         O título é a promessa do topo da página, palavra por palavra. Repetida
         aqui, ela é a mesma afirmação em outro lugar; reescrita, seriam duas
         promessas. ATENÇÃO: se `GARANTIA` mudar em `comparacao/config.ts`, esta
         linha muda no mesmo commit. -->
    <title>Doxa — Um milhão de views. Ou seu dinheiro de volta.</title>
    <meta
      name="description"
      content="Uma foto e um áudio viram sessenta conteúdos em noventa dias. Um milhão de views somadas, ou seu dinheiro de volta."
    />
    <meta name="theme-color" content="#0B0B0B" />

    <!-- PROVISÓRIO: a inicial na tipografia da página. Trocar é substituir o
         arquivo — ver o comentário dentro dele. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doxa" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Um milhão de views. Ou seu dinheiro de volta." />
    <meta
      property="og:description"
      content="Uma foto e um áudio viram sessenta conteúdos em noventa dias."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- A IMAGEM DA PRÉVIA, e o endereço dela. Estas linhas estiveram
         comentadas por dois pendentes, e os dois caíram.

         O arquivo existe: `public/og.png`, 1200 por 630, PNG. Ele NÃO foi
         desenhado à mão — sai de `scripts/og-imagem.mjs` (`pnpm og:imagem`),
         que monta a imagem com a wordmark e as duas frases abaixo, palavra por
         palavra. Mexeu no `og:title` ou na `og:description` daqui, rode o
         script no mesmo commit: a imagem carrega uma CÓPIA das duas, e cópia é
         a única coisa neste `<head>` que não avisa quando envelhece.

         PNG e não AVIF/WebP: boa parte dos leitores de link não decodifica os
         dois, e o cartão sairia com a moldura vazia.

         As URLs são ABSOLUTAS, e não é preciosismo: `og:image` relativa não é
         resolvida por leitor de link nenhum. O domínio é `doxaviral.com` —
         *viral*, com L. Existe um `doxavira.com` sem L que nunca apontou para
         cá e responde 200 para quem confere errado (ver o CLAUDE.md).

         `og:image:width` / `height` deixam o leitor reservar a caixa antes de a
         imagem chegar, e é o que evita o cartão pulando de tamanho na conversa. -->
    <meta property="og:url" content="https://www.doxaviral.com/" />
    <meta property="og:image" content="https://www.doxaviral.com/og.png" />
    <meta
      property="og:image:alt"
      content="Doxa — um milhão de views. Ou seu dinheiro de volta."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://www.doxaviral.com/og.png" />

    <!-- A forma canônica da home: com `www`, https, barra final única. Ela diz
         ao buscador qual endereço vale quando o mesmo conteúdo chega por
         `?utm_source=…`, por `doxaviral.com` sem www ou por http — sem ela, são
         quatro URLs disputando a mesma posição. As páginas de `/solucoes`,
         `/guias` e companhia emitem a delas em `src/seo/head.ts`. -->
    <link rel="canonical" href="https://www.doxaviral.com/" />

    <!-- ─── QUEM É A DOXA, PARA QUEM LÊ MÁQUINA ─────────────────────────────
         A Organização e o site, declarados UMA VEZ e só aqui: a landing é a
         raiz do domínio, e a entidade se afirma na raiz. As páginas de conteúdo
         não repetem estes dois nós — elas apontam para eles por dentro
         (`WebPage.isPartOf`, `Article.publisher`, em `src/seo/schema.ts`). A
         mesma entidade afirmada em trinta páginas não fica trinta vezes mais
         forte; fica trinta vezes mais fácil de divergir.

         ATENÇÃO — ESTE BLOCO É CÓPIA. O original são as funções `organization()`
         e `webSite()` de `src/seo/schema.ts`, e `schema.test.ts` COMPARA os dois:
         mexeu aqui sem mexer lá (ou o contrário), o teste reprova. É de
         propósito — este arquivo é HTML estático e não consegue importar TS.

         Sem `sameAs`: ele lista os perfis oficiais da entidade, e não há um
         único link de rede social no repositório. Sem `SearchAction`: ele
         promete uma busca interna que este site não tem. Schema só afirma o que
         a página sustenta (§46). -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"Organization","name":"Doxa","url":"https://www.doxaviral.com/","logo":{"@type":"ImageObject","url":"https://www.doxaviral.com/og.png","width":1200,"height":630}},
        {"@type":"WebSite","name":"Doxa","url":"https://www.doxaviral.com/","inLanguage":"pt-BR","publisher":{"@type":"Organization","name":"Doxa","url":"https://www.doxaviral.com/"}}
      ]}
    </script>
    <!-- As duas fontes que a primeira dobra desenha: a serifada do título e a
         sans do corpo. Declaradas aqui porque um `@font-face` dentro do CSS só
         é descoberto depois de o CSS baixar e o navegador achar o texto que
         precisa dele — com o preload elas viajam junto com o CSS, e não depois.
         Só estas duas: precarregar as seis faria as outras quatro competirem
         por banda com o que está na tela. `crossorigin` é obrigatório mesmo
         sendo mesma origem, senão o navegador baixa o arquivo duas vezes. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/InstrumentSerif-400-normal-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/Almarai-400-normal-latin.woff2" />

    <!-- A foto do primeiro case do hero: é ela que o navegador mede como maior
         elemento da dobra, e sem isto ele só a descobre depois de baixar,
         parsear e executar o JS que a monta.

         O `imagesrcset` tem de repetir o `srcSet` do `ClientPhoto` LETRA POR
         LETRA. Um preload que não bate com o que o componente pede não acelera
         nada: o navegador busca o arquivo daqui, o React monta a imagem
         pedindo outro, e o telefone baixa OS DOIS — o preload deixa de ser
         adiantamento e vira peso extra em cima do LCP que ele existe para
         proteger. Mexeu num, mexe no outro; ver `midSrc` em `MediaFrame`. -->
    <link rel="preload" as="image" type="image/avif"
      imagesrcset="/media/magalu-foto-480.avif 480w, /media/magalu-foto.avif 888w"
      imagesizes="(min-width: 768px) 21vw, 150px"
      href="/media/magalu-foto.avif"
      fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
